<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            width: 400px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        .result {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border-radius: 6px;
            background: #f8f9fa;
            display: none;
        }
        
        .result h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .bmi-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .bmi-category {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .underweight { color: #3498db; }
        .normal { color: #2ecc71; }
        .overweight { color: #f39c12; }
        .obese { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        
        <div class="input-group">
            <label for="height">Height</label>
            <input type="number" id="height" placeholder="Enter height">
            <select id="height-unit">
                <option value="cm">Centimeters</option>
                <option value="m">Meters</option>
                <option value="ft">Feet</option>
                <option value="in">Inches</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="weight">Weight</label>
            <input type="number" id="weight" placeholder="Enter weight">
            <select id="weight-unit">
                <option value="kg">Kilograms</option>
                <option value="lb">Pounds</option>
            </select>
        </div>
        
        <button onclick="calculateBMI()">Calculate BMI</button>
        
        <div class="result" id="result">
            <h2>Your BMI Result</h2>
            <div class="bmi-value" id="bmi-value"></div>
            <div class="bmi-category" id="bmi-category"></div>
            <div id="bmi-message"></div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // Get input values
            let height = parseFloat(document.getElementById('height').value);
            let weight = parseFloat(document.getElementById('weight').value);
            
            // Get selected units
            const heightUnit = document.getElementById('height-unit').value;
            const weightUnit = document.getElementById('weight-unit').value;
            
            // Validate inputs
            if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
                alert('Please enter valid height and weight values');
                return;
            }
            
            // Convert height to meters
            if (heightUnit === 'cm') {
                height = height / 100;
            } else if (heightUnit === 'ft') {
                height = height * 0.3048;
            } else if (heightUnit === 'in') {
                height = height * 0.0254;
            }
            
            // Convert weight to kilograms
            if (weightUnit === 'lb') {
                weight = weight * 0.453592;
            }
            
            // Calculate BMI
            const bmi = weight / (height * height);
            
            // Display result
            document.getElementById('bmi-value').textContent = bmi.toFixed(1);
            
            // Determine BMI category
            let category, message, categoryClass;
            
            if (bmi < 18.5) {
                category = "Underweight";
                message = "You may need to gain some weight. Consult with a healthcare professional.";
                categoryClass = "underweight";
            } else if (bmi >= 18.5 && bmi < 25) {
                category = "Normal weight";
                message = "You have a healthy weight. Maintain it with regular exercise and a balanced diet.";
                categoryClass = "normal";
            } else if (bmi >= 25 && bmi < 30) {
                category = "Overweight";
                message = "You may need to lose some weight. Focus on healthy eating and regular physical activity.";
                categoryClass = "overweight";
            } else {
                category = "Obese";
                message = "It's recommended to lose weight to reduce health risks. Consult with a healthcare professional.";
                categoryClass = "obese";
            }
            
            const categoryElement = document.getElementById('bmi-category');
            categoryElement.textContent = category;
            categoryElement.className = 'bmi-category ' + categoryClass;
            
            document.getElementById('bmi-message').textContent = message;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
